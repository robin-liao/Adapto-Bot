# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  - main

resources:
  - repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: "359c22d2-969e-4f4f-af87-861c1ced960b"
  azureSubscription: "msteams.nonprod.pub.msft.aplt(534d17fb-600d-4a58-8540-40599fb5ddce)"
  acrName: "robin"
  imageRepository: "robin/adapto-v4-bot"
  containerRegistry: "robin.azurecr.io"
  dockerfilePath: "$(Build.SourcesDirectory)/Dockerfile"
  tag: "latest"
  appName: "adapto-bot"
  resourceGroupName: "robin-rg"
  containerPort: "5487"

  # Agent VM image name
  vmImageName: "ubuntu-latest"

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: CmdLine@2
            inputs:
              script: "yarn install"
          - task: CmdLine@2
            inputs:
              script: "yarn build"
          - task: AzureCLI@2
            displayName: Build and push linux/amd64 image in ACR
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(imageRepository):$(tag)" \
                  --platform linux/amd64 \
                  --file "$(dockerfilePath)" \
                  "$(Build.SourcesDirectory)"
          - task: AzureWebAppContainer@1
            displayName: "Deploy latest container image to Web App"
            inputs:
              azureSubscription: "$(azureSubscription)"
              appName: "$(appName)"
              containers: "$(containerRegistry)/$(imageRepository):$(tag)"
          - task: AzureCLI@2
            displayName: "Configure Web App container + enable ACR continuous deployment"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                IMAGE_NAME="$(containerRegistry)/$(imageRepository):$(tag)"

                # Point the Web App to your ACR image.
                az webapp config container set \
                  --name "$(appName)" \
                  --resource-group "$(resourceGroupName)" \
                  --container-image-name "$IMAGE_NAME" \
                  --container-registry-url "https://$(containerRegistry)"

                # Make App Service route traffic to the containerized Node app port and enable ACR-triggered pulls.
                az webapp config appsettings set \
                  --name "$(appName)" \
                  --resource-group "$(resourceGroupName)" \
                  --settings WEBSITES_PORT="$(containerPort)" DOCKER_ENABLE_CI="true"

                # Create/refresh webhook hookup so new image pushes trigger automatic redeploy.
                az webapp deployment container config \
                  --name "$(appName)" \
                  --resource-group "$(resourceGroupName)" \
                  --enable-cd true
